version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - redis
      - kafka
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - whatsapp-net

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword       # root user password
      MYSQL_DATABASE: whatsapp_db             # auto-created DB
      MYSQL_USER: appuser                     # non-root user
      MYSQL_PASSWORD: appuserpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - whatsapp-net

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - whatsapp-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - whatsapp-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - whatsapp-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - whatsapp-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - whatsapp-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - whatsapp-net
    volumes:
      - grafana-storage:/var/lib/grafana

  k6:
    image: grafana/k6
    volumes:
      - ./k6:/k6
    working_dir: /k6
    entrypoint: ["k6"]
    command: ["run", "/k6/test.js"]
    networks:
      - whatsapp-net
    depends_on:
      - backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - whatsapp-net

volumes:
  mysql_data:
  grafana-storage:

networks:
  whatsapp-net:
    driver: bridge
