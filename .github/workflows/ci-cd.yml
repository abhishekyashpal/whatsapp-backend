name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/whatsapp-backend:${{ github.sha }}

      # 👉 Step 2: Update GitOps repo
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: abhishekyashpal/whatsapp-backend-gitops
          token: ${{ secrets.GITOPS_TOKEN_WHATSAPP_BACKEND }}
          path: gitops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm values with new image tag
        run: |
          cd gitops/charts/backend
          yq -i '.image.repository = "${{ secrets.DOCKER_USERNAME }}/whatsapp-backend"' values.yaml
          yq -i '.image.tag = "${{ github.sha }}"' values.yaml

      - name: Commit and push changes to GitOps repo
        run: |
          cd gitops
          git config user.name "ci-bot"
          git config user.email "ci-bot@yourorg.com"
          git add .
          git commit -m "ci: bump backend image to ${{ github.sha }}"
          git push origin master

  compose-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run services with Docker Compose
        run: docker compose up -d --build

      - name: Run integration tests
        run: npm run test:integration || true

      - name: Shut down services
        run: docker compose down
